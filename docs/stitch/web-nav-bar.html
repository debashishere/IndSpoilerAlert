<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndSpoiler Alert - Web Navigation Bar Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Hanken Grotesk', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0d47a1',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#f0f4f9] min-h-screen text-slate-800 font-sans p-8 md:p-14 antialiased selection:bg-blue-100 selection:text-blue-900">
  <div class="max-w-7xl mx-auto space-y-10">
    <!-- MAIN NAVBAR FRAME (Exact recreation matching User Uploaded Image 1 & Screen 4/10 specifications) -->
    <header class="w-full bg-white rounded-xl border border-slate-200/90 shadow-sm px-4 md:px-6 py-2.5 flex items-center justify-between transition-all duration-200">
      <!-- Left: Brand Logo & Title -->
      <div class="flex items-center gap-3.5">
        <!-- Official Emblem Logo -->
        <div class="w-10 h-10 rounded-lg overflow-hidden bg-gradient-to-br from-blue-700 to-blue-900 flex items-center justify-center shadow-sm flex-shrink-0">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="currentColor">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
          </svg>
        </div>

        <!-- Brand Typography -->
        <div class="flex flex-col">
          <span class="text-lg md:text-xl font-bold tracking-tight text-slate-950 leading-tight">IndSpoiler Alert</span>
          <span class="text-[10px] md:text-[11px] font-bold tracking-[0.14em] text-slate-400 uppercase leading-none mt-0.5">Enterprise Liquidation OS</span>
        </div>
      </div>

      <!-- Center: Rounded Pill Nav Navigation Bar -->
      <nav class="hidden lg:flex items-center gap-1.5 bg-slate-50/90 p-1.5 rounded-full border border-slate-200/70 shadow-inner">
        <!-- Active Tab: Ingestion -->
        <button class="px-5 py-2 rounded-full bg-[#0d47a1] text-white text-sm font-semibold shadow-sm transition-all duration-150">
          Ingestion
        </button>
        
        <!-- Inactive Tab: Insight -->
        <button class="px-4 py-2 rounded-full text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 text-sm font-medium transition-all duration-150">
          Insight
        </button>

        <!-- Inactive Tab: Workflow -->
        <button class="px-4 py-2 rounded-full text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 text-sm font-medium transition-all duration-150">
          Workflow
        </button>

        <!-- Inactive Tab: Marketplace -->
        <button class="px-4 py-2 rounded-full text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 text-sm font-medium transition-all duration-150">
          Marketplace
        </button>

        <!-- Inactive Tab: Inbox -->
        <button class="px-4 py-2 rounded-full text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 text-sm font-medium transition-all duration-150 flex items-center gap-1.5">
          <span>Inbox</span>
        </button>

        <!-- Inactive Tab: Settings -->
        <button class="px-4 py-2 rounded-full text-slate-600 hover:text-slate-900 hover:bg-slate-200/60 text-sm font-medium transition-all duration-150">
          Settings
        </button>
      </nav>

      <!-- Right: Actions & User Avatar -->
      <div class="flex items-center gap-3">
        <!-- Notification Bell -->
        <button class="w-10 h-10 rounded-full border border-slate-200 bg-white flex items-center justify-center text-slate-600 hover:text-slate-900 hover:bg-slate-50 hover:border-slate-300 transition-all duration-150 shadow-sm relative" title="Notifications">
          <span class="material-symbols-outlined text-xl">notifications</span>
          <span class="absolute top-2 right-2 w-2 h-2 bg-blue-600 rounded-full border-2 border-white"></span>
        </button>

        <!-- User Profile Avatar Pill (DH - Debashishere007) -->
        <div class="flex items-center gap-2.5 pl-1 pr-1.5 py-1 rounded-full border border-slate-200/80 bg-slate-50/70 hover:bg-slate-100/70 transition-all duration-150 cursor-pointer">
          <div class="w-8 h-8 rounded-full bg-[#0d47a1] text-white flex items-center justify-center font-bold text-xs shadow-sm">
            DH
          </div>
          <div class="hidden sm:flex flex-col pr-2 text-left">
            <span class="text-xs font-bold text-slate-800 leading-tight">Debashishere007</span>
            <span class="text-[10px] font-medium text-emerald-600 leading-none flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Verified Agent
            </span>
          </div>
          <span class="material-symbols-outlined text-slate-400 text-base pr-1">expand_more</span>
        </div>
      </div>
    </header>
  </div>
</body>
</html>
